# Provider selection
spring.ai.model.chat=openai
spring.ai.model.image=openai

# OpenAI API Key
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model configuration
spring.ai.openai.chat.model=gpt-6-luna
#spring.ai.openai.chat.temperature=0.7

# Image generation configuration
spring.ai.openai.image.model=gpt-image-2.6-sunburst
spring.ai.openai.image.n=1
spring.ai.openai.image.size=1024x1024
#spring.ai.openai.image.response_format=b64_json

# HTTP client configuration
spring.ai.openai.timeout=120s
spring.ai.openai.max-retries=2